[package]
name = "project_replace"
authors = ["Warp Team <dev@warp.dev>"]
version = "0.1.0"
edition = "2024"
description = "Planning, applying and undoing a replace across the files of a project"
publish.workspace = true
license.workspace = true

[dependencies]
grep = "0.4.1"
file_write_guard.workspace = true
hex.workspace = true
ignore = "0.4.20"
log.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
